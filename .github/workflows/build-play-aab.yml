name: Build signed Play AAB

on:
  workflow_dispatch:

jobs:
  build-play-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar secretos de firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BLUELINGO_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLUELINGO_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BLUELINGO_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Falta BLUELINGO_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Falta BLUELINGO_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Falta BLUELINGO_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Restaurar clave de carga
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BLUELINGO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bluelingo-upload-key.jks"

      - name: Compilar AAB release
        run: gradle bundleRelease --stacktrace

      - name: Firmar AAB con upload key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.BLUELINGO_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BLUELINGO_UPLOAD_KEY_PASSWORD }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Bluelingo-v8.1.1-play.aab
          jarsigner             -keystore "$RUNNER_TEMP/bluelingo-upload-key.jks"             -storepass "$STORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -sigalg SHA256withRSA             -digestalg SHA-256             app/build/outputs/bundle/release/Bluelingo-v8.1.1-play.aab             bluelingo_upload
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/Bluelingo-v8.1.1-play.aab

      - name: Guardar AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: Bluelingo-v8.1.1-play-aab
          path: app/build/outputs/bundle/release/Bluelingo-v8.1.1-play.aab
